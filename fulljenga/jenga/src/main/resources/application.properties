spring.application.name=jenga
# Port 3307 confirmed. Added essential handshake and security flags.
spring.datasource.url=jdbc:mysql://localhost:3307/jenga_p2p_db

spring.datasource.username=root
# Set MYSQL_PASSWORD environment variable before running
spring.datasource.password=Football3940

# JPA / Hibernate settings
# Use 'update' for development (preserves data), 'validate' for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jackson date serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

